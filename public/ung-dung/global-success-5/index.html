/* Layout: app shell — left rail on wide screens, bottom tab bar on phones; content column max 1040px.
   Look: the Global Success textbook — orange unit badge, aqua lesson banners, sunny highlights on a sky-tinted page. */
:root {
  --page: #EEF6FA;
  --card: #FFFFFF;
  --ink: #17293A;
  --ink-soft: #4B6274;
  --line: #D3E3EC;
  --orange: #EE6A2C;      /* Unit badge */
  --orange-deep: #C94E15;
  --aqua: #159BC0;        /* Lesson banner */
  --aqua-deep: #0B7896;
  --aqua-tint: #DDF2F8;
  --sun: #FFC530;
  --sun-tint: #FFF4D2;
  --grass: #23A55A;
  --grass-tint: #DDF5E6;
  --berry: #DC3F45;
  --berry-tint: #FDE3E3;
  --violet: #6B57D9;
  --violet-tint: #ECE8FF;
  --shadow: 0 3px 0 var(--line);
  --font-display: 'Baloo 2', 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-ipa: 'Andika', 'Segoe UI', 'Lucida Sans Unicode', 'Arial Unicode MS', sans-serif;
  --emoji: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.ipa { font-family: var(--font-ipa); letter-spacing: 0.01em; }
.emo { font-family: var(--emoji); font-style: normal; line-height: 1; }
[hidden] { display: none !important; }

/* ---------- Shell ---------- */
.shell { display: flex; min-height: 100%; }
.rail {
  width: 232px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
  background: var(--card); border-right: 2px solid var(--line);
  display: flex; flex-direction: column; gap: 6px; padding: 20px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-badge {
  width: 46px; height: 46px; border-radius: 14px; background: var(--orange); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem;
  box-shadow: 0 3px 0 var(--orange-deep);
}
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; line-height: 1.05; }
.brand-name small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 0.72rem; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
.nav-btn {
  display: flex; align-items: center; gap: 12px; border: 2px solid transparent; background: none;
  padding: 10px 12px; border-radius: var(--r-sm); font-weight: 800; color: var(--ink-soft); text-align: left;
}
.nav-btn .emo { font-size: 1.4rem; width: 28px; text-align: center; }
.nav-btn:hover { background: var(--aqua-tint); }
.nav-btn.active { background: var(--aqua-tint); border-color: var(--aqua); color: var(--aqua-deep); }
.rail-foot { margin-top: auto; font-size: 0.78rem; color: var(--ink-soft); padding: 8px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px);
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar .who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; background: none; border: 0; padding: 0; text-align: left; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--sun-tint); border: 2px solid var(--sun); display: grid; place-items: center; font-size: 1.4rem; flex-shrink: 0; }
.who-text { min-width: 0; }
.who-name { font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-level { font-size: 0.78rem; font-weight: 800; color: var(--violet); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  background: var(--card); border: 2px solid var(--line); font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip.fire { border-color: #FFB38A; color: var(--orange-deep); }
.chip.coin { border-color: #F5D06A; color: #9A6A00; }
.chip.bump { animation: bump .5s ease; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 1.1rem; flex-shrink: 0; }

.content {
  width: 100%; max-width: 1040px; margin: 0 auto;
  padding-block: 8px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
.tabbar { display: none; }

/* ---------- Generic UI ---------- */
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--r-md); padding: 18px; box-shadow: var(--shadow); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title h2 { font-size: 1.45rem; }
.eyebrow { font-size: 0.76rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.muted { color: var(--ink-soft); }
.btn {
  border: 0; border-radius: var(--r-sm); padding: 12px 20px; font-weight: 900; font-size: 1rem;
  background: var(--aqua); color: #fff; box-shadow: 0 4px 0 var(--aqua-deep);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--aqua-deep); }
.btn:disabled { opacity: .45; }
.btn.orange { background: var(--orange); box-shadow: 0 4px 0 var(--orange-deep); }
.btn.green { background: var(--grass); box-shadow: 0 4px 0 #17803F; }
.btn.red { background: var(--berry); box-shadow: 0 4px 0 #A82A2F; }
.btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.sun { background: var(--sun); color: #5A3B00; box-shadow: 0 4px 0 #D49A00; }
.btn.big { padding: 15px 26px; font-size: 1.12rem; }
.btn.block { width: 100%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; min-width: 0; }
.bar { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--grass); border-radius: 99px; transition: width .4s ease; }
.bar.violet > i { background: var(--violet); }
.bar.sun > i { background: var(--sun); }

/* ---------- Home ---------- */
.hero-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.continue-card { background: var(--aqua); color: #fff; border: 0; box-shadow: 0 5px 0 var(--aqua-deep); display: flex; flex-direction: column; gap: 12px; }
.continue-card .eyebrow { color: #CFF1FA; }
.continue-card h2 { font-size: 1.7rem; }
.continue-card .unit-pill { align-self: flex-start; background: var(--orange); color: #fff; font-weight: 900; border-radius: 10px; padding: 2px 10px; font-family: var(--font-display); }
.continue-card .btn { align-self: flex-start; background: #fff; color: var(--aqua-deep); box-shadow: 0 4px 0 #9BD7E7; }
.goal-card { display: flex; flex-direction: column; gap: 12px; }
.goal-head { display: flex; align-items: center; gap: 14px; }
.ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0; background: conic-gradient(var(--grass) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.ring > span { width: 58px; height: 58px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-weight: 900; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.quest { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--page); }
.quest .emo { font-size: 1.3rem; }
.quest-text { flex: 1; min-width: 0; font-weight: 800; font-size: 0.92rem; }
.quest .bar { height: 8px; margin-top: 4px; }
.quest.done { background: var(--grass-tint); }
.quest-claim { font-size: 0.85rem; padding: 6px 12px; }

.term-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.term-tag { font-family: var(--font-display); font-weight: 800; background: var(--violet); color: #fff; padding: 2px 12px; border-radius: 10px; }
.unit-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.unit-card {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; text-align: left;
  background: var(--card); border: 2px solid var(--line); border-radius: var(--r-md); padding: 14px; box-shadow: var(--shadow);
  transition: transform .12s, border-color .12s;
}
.unit-card:hover { transform: translateY(-2px); border-color: var(--aqua); }
.unit-num {
  grid-row: span 2; width: 58px; height: 58px; border-radius: 16px; background: var(--orange); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 3px 0 var(--orange-deep);
}
.unit-num small { font-size: 0.6rem; font-weight: 900; letter-spacing: 0.08em; }
.unit-num b { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; }
.unit-card.done .unit-num { background: var(--grass); box-shadow: 0 3px 0 #17803F; }
.unit-title { font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; line-height: 1.1; }
.unit-vi { font-size: 0.85rem; color: var(--ink-soft); font-weight: 700; }
.unit-meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.dots { display: flex; gap: 4px; flex: 1; }
.dots i { flex: 1; height: 8px; border-radius: 99px; background: var(--line); }
.dots i.on { background: var(--grass); }
.stars { font-size: 0.95rem; letter-spacing: 1px; white-space: nowrap; }
.stars .off { filter: grayscale(1); opacity: .35; }
.review-card { background: var(--sun-tint); border-color: #F2D47A; }
.review-card .unit-num { background: var(--sun); color: #5A3B00; box-shadow: 0 3px 0 #D49A00; }

/* ---------- Unit page ---------- */
.unit-hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.unit-badge-big {
  width: 104px; height: 104px; border-radius: 0 0 52px 0; background: var(--orange); color: #fff;
  display: flex; flex-direction: column; justify-content: center; padding-left: 16px; box-shadow: 0 5px 0 var(--orange-deep);
}
.unit-badge-big small { font-weight: 900; letter-spacing: 0.1em; font-size: 0.8rem; }

/* ---------- Activity ---------- */

/* Settings */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

const Sound = {
  ctx: null, voices: [],
  init() {
    if ('speechSynthesis' in window) {
      const load = () => { this.voices = speechSynthesis.getVoices(); };
      load(); speechSynthesis.onvoiceschanged = load;
    }
  },
  ac() {
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(notes, type = 'sine', dur = 0.14, gap = 0.08, vol = 0.18) {
    if (!P() || !P().set.sound) return;
    const c = this.ac(); if (!c) return;
    try {
      notes.forEach((f, i) => {
        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + i * gap;
        o.type = type; o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur);
      });
    } catch (e) { /* bỏ qua */ }
  },
  pop() { this.tone([520, 780], 'sine', 0.07, 0.04, 0.12); },
  flip() { this.tone([330, 520], 'sine', 0.06, 0.03, 0.1); },
  correct() { this.tone([523, 659, 784, 1047], 'triangle', 0.22, 0.07, 0.2); },
  wrong() { this.tone([260, 180], 'sawtooth', 0.2, 0.1, 0.12); },
  coin() { this.tone([988, 1319], 'square', 0.1, 0.07, 0.07); },
  win() { this.tone([523, 659, 784, 659, 784, 1047], 'triangle', 0.25, 0.11, 0.2); },
  level() { this.tone([392, 523, 659, 784, 1047, 1319], 'triangle', 0.3, 0.1, 0.2); },
  voice() {
    const pref = P()?.set.accent === 'us' ? ['en-US', 'en_US'] : ['en-GB', 'en_GB'];
    const v = this.voices;
    const good = n => /Google|Natural|Online|Neural|Samantha|Daniel|Serena|Libby|Sonia|Aria|Jenny/i.test(n);
    return v.find(x => pref.includes(x.lang) && good(x.name)) || v.find(x => pref.includes(x.lang))
      || v.find(x => /^en/i.test(x.lang) && good(x.name)) || v.find(x => /^en/i.test(x.lang)) || null;
  },
  speak(text, slow = false, onend) {
    if (!('speechSynthesis' in window)) { onend && onend(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/–/g, ','));
      const v = this.voice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
      const base = P()?.set.rate || 0.9;
      u.rate = slow ? Math.max(0.5, base - 0.32) : base; u.pitch = 1.05;
      const token = (this._tok = (this._tok || 0) + 1);
      if (onend) u.onend = () => token === this._tok && onend();
      setTimeout(() => token === this._tok && speechSynthesis.speak(u), 50);
    } catch (e) { onend && onend(); }
  },
  speakSeq(list, slow) { const q = [...list]; const next = () => { const t = q.shift(); if (t) this.speak(t, slow, () => setTimeout(next, 300)); }; next(); }
};

const xpNeed = lv => 80 + (lv - 1) * 40;
function levelInfo(xp) { let lv = 1, rest = xp; while (rest >= xpNeed(lv)) { rest -= xpNeed(lv); lv++; } return { lv, into: rest, need: xpNeed(lv) }; }
function levelTitle(lv) { let t = LEVEL_TITLES[0][1]; for (const [l, n] of LEVEL_TITLES) if (lv >= l) t = n; return t; }

function ensureDaily() {
  const p = P(); const d = dateKey();
  if (!p.daily || p.daily.date !== d) {
    const h = hash(d + p.id); const pool = [...QUESTS]; const chosen = [];
    for (let i = 0; i < 3; i++) chosen.push(pool.splice((h >> (i * 5)) % pool.length, 1)[0]);
    p.daily = { date: d, xp: 0, goalDone: false, bonus: false, quests: chosen.map(q => ({ id: q.id, n: q.n, prog: 0, claimed: false })) };
    saveDB();
  }
  return p.daily;
}
function questProgress(id, amount = 1, mode = 'add') {
  const daily = ensureDaily();
  daily.quests.forEach(q => {
    if (q.id !== id || q.claimed) return;
    const before = q.prog;
    q.prog = mode === 'max' ? Math.max(q.prog, amount) : q.prog + amount;
    q.prog = Math.min(q.prog, q.n);
    if (before < q.n && q.prog >= q.n) toast(`${QUESTS.find(x => x.id === id).icon} Xong nhiệm vụ! Nhận thưởng ở Trang chủ`);
  });
}
function gainXP(n) {
  const p = P(); const before = levelInfo(p.xp).lv; p.xp += n;
  const daily = ensureDaily(); daily.xp += n;
  const after = levelInfo(p.xp).lv;
  if (after > before) { p.coins += 30; queueCelebrate({ type: 'level', lv: after }); }
  if (!daily.goalDone && daily.xp >= p.set.goal) { daily.goalDone = true; p.chestsPending++; queueCelebrate({ type: 'goal' }); }
}

function checkBadges() {
  const p = P();
  BADGES.forEach(b => { if (!p.badges.includes(b.id) && b.ok(p)) { p.badges.push(b.id); p.coins += 20; queueCelebrate({ type: 'badge', b }); } });

function rollChest() {
  const p = P(); p.stats.chests++;
  const r = Math.random();
  const unowned = STICKERS.filter(s => !p.stickers.includes(s.id));
  if (r < 0.22 && unowned.length) {
    const roll = Math.random(); const tier = roll < 0.07 ? 'epic' : roll < 0.32 ? 'rare' : 'common';
    const pool = unowned.filter(s => s.rar === tier).length ? unowned.filter(s => s.rar === tier) : unowned;
    const s = pool[rand(0, pool.length - 1)]; p.stickers.push(s.id);
    return { kind: 'sticker', s };
  }
  const coins = r > 0.95 ? rand(50, 80) : r > 0.75 ? rand(20, 35) : rand(8, 18);
  p.coins += coins; return { kind: 'coins', coins };
}
function markStudyToday() {
  const p = P(); const d = dateKey();
  if (p.lastStudy === d) return;
  p.streak = p.lastStudy === yesterdayKey() ? p.streak + 1 : 1;
  p.bestStreak = Math.max(p.bestStreak, p.streak); p.lastStudy = d;
  toast(`🔥 Chuỗi học ${p.streak} ngày liên tiếp!`);
}

// Hàng đợi chúc mừng: hiện lần lượt từng thông báo
const celebrateQ = []; let celebrating = false;
function queueCelebrate(c) { celebrateQ.push(c); }
function flushCelebrations() {
  if (celebrating || !celebrateQ.length) return;
  celebrating = true; const c = celebrateQ.shift();
  const done = () => { celebrating = false; saveDB(); renderTop(); flushCelebrations(); };
  if (c.type === 'level') { Sound.level(); Confetti.burst(120); modal({ art: '⬆️', title: `Lên cấp ${c.lv}!`, body: `Danh hiệu mới: <b>${levelTitle(c.lv)}</b>. Thưởng +30 ⭐.`, ok: 'Tuyệt vời!', onOk: done }); }
  else if (c.type === 'badge') { Sound.win(); Confetti.burst(80); modal({ art: c.b.icon, title: 'Huy hiệu mới!', body: `<b>${c.b.name}</b><br>${c.b.desc}. Thưởng +20 ⭐.`, ok: 'Nhận huy hiệu', onOk: done }); }
  else if (c.type === 'goal') { Sound.win(); Confetti.burst(100); modal({ art: '🎯', title: 'Đạt mục tiêu hôm nay!', body: 'Bé đã đạt mục tiêu điểm kinh nghiệm của ngày. Một rương quà đang chờ bé!', ok: 'Mở rương', onOk: () => { celebrating = false; openChestModal(done); } }); }
  else done();
}

// ---------------- 5. Pháo giấy ----------------
const Confetti = {
  cv: null, ctx: null, parts: [], raf: 0,
  burst(n = 60) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!this.cv) { this.cv = document.createElement('canvas'); Object.assign(this.cv.style, { position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 200, width: '100%', height: '100%' }); document.body.appendChild(this.cv); this.ctx = this.cv.getContext('2d'); }
    this.cv.width = innerWidth; this.cv.height = innerHeight;
    const cols = ['#EE6A2C', '#159BC0', '#FFC530', '#23A55A', '#6B57D9', '#D1366F'];
    for (let i = 0; i < n; i++) this.parts.push({ x: innerWidth / 2 + rand(-80, 80), y: innerHeight * 0.4, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 13 - 4, s: rand(6, 11), c: cols[i % cols.length], r: Math.random() * 6, life: 120 });
    if (!this.raf) this.tick();
  },
  tick() {
    const { ctx, cv } = this; ctx.clearRect(0, 0, cv.width, cv.height);
    this.parts.forEach(p => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.1; p.life--; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6); ctx.restore(); });
    this.parts = this.parts.filter(p => p.life > 0 && p.y < cv.height + 20);
    this.raf = this.parts.length ? requestAnimationFrame(() => this.tick()) : (ctx.clearRect(0, 0, cv.width, cv.height), 0);
  }
};

const view = { screen: 'home', unit: null };

function toast(msg) {
  const w = $('#toasts'); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  w.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function bumpChip(kind) { const el = $(`.chip.${kind}`); if (!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function modal({ art = '🎉', title = '', body = '', ok = 'Đồng ý', cancel = null, danger = false, onOk, onCancel, html = '' }) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    ${art ? `<div class="big-emo">${emo(art)}</div>` : ''}<h2>${title}</h2>${body ? `<p class="muted">${body}</p>` : ''}${html}
    <div class="row" style="justify-content:center">${cancel ? `<button class="btn ghost" data-x="c">${cancel}</button>` : ''}<button class="btn ${danger ? 'red' : 'orange'}" data-x="o">${ok}</button></div></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('[data-x="o"]').onclick = () => { Sound.pop(); close(); onOk && onOk(ov); };
  const c = ov.querySelector('[data-x="c"]'); if (c) c.onclick = () => { Sound.pop(); close(); onCancel && onCancel(); };
  setTimeout(() => ov.querySelector('[data-x="o"]').focus(), 30);
  return ov;
}
function confirmBox(title, body, okText, onOk) { modal({ art: '⚠️', title, body, ok: okText, cancel: 'Huỷ', danger: true, onOk }); }

function openChestModal(after) {
  const p = P(); if (p.chestsPending > 0) p.chestsPending--;
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h2>Rương quà bí mật</h2><p class="muted">Chạm vào rương để mở!</p>
    <button class="chest" aria-label="Mở rương">${emo('🎁')}</button><div class="reward-pop" aria-live="polite"></div>
    <button class="btn orange" hidden>Nhận quà</button></div>`;
  document.body.appendChild(ov);
  const chest = ov.querySelector('.chest'), out = ov.querySelector('.reward-pop'), btn = ov.querySelector('.btn');
  chest.onclick = () => {
    if (chest.disabled) return; chest.disabled = true;
    const r = rollChest(); chest.classList.add('opened'); Sound.coin(); Confetti.burst(70);
    if (r.kind === 'sticker') { chest.innerHTML = emo(r.s.icon); out.innerHTML = `Nhãn dán mới: ${esc(r.s.name)}<br><span class="rar ${r.s.rar}">${RAR_NAME[r.s.rar]}</span>`; }
    else { chest.innerHTML = emo('⭐'); out.textContent = `+${r.coins} ⭐`; }
    saveDB(); renderTop(); btn.hidden = false; btn.focus();
  };
  btn.onclick = () => { Sound.pop(); ov.remove(); checkBadges(); saveDB(); after && after(); };
}

function renderTop() {

function go(screen, extra = {}) {

}
function render() {

// ---------------- 7. Trang chủ: lộ trình học ----------------
function nextRecommendation() {
  const p = P();
  for (const u of UNITS) {
    const st = p.units[u.unit]?.steps || {};
    const s = STEPS.find(x => !st[x.id]);
    if (s) return { u, s };
  }
  return null;
}
function unitCard(u) {
  const st = P().units[u.unit] || { steps: {}, stars: 0 }; const done = stepsDone(u.unit);
  return `<button class="unit-card ${st.stars ? 'done' : ''}" data-unit="${u.unit}">
    <span class="unit-num"><small>UNIT</small><b>${u.unit}</b></span>
    <span class="unit-title">${esc(u.title)}</span>
    <span class="unit-vi">${esc(u.vi)} · SGK tr.${u.page}</span>
    <span class="unit-meta"><span class="dots" aria-label="${done}/6 chặng">${STEPS.map(s => `<i class="${st.steps[s.id] ? 'on' : ''}"></i>`).join('')}</span>
    <span class="stars" aria-label="${st.stars} sao">${[1, 2, 3].map(i => `<span class="${st.stars >= i ? '' : 'off'}">⭐</span>`).join('')}</span></span>
  </button>`;
}
function reviewCard(r) {
  const best = P().units[r.id]?.best || 0;
  return `<button class="unit-card review-card" data-review="${r.id}">
    <span class="unit-num"><small>ÔN</small><b>${emo('🔁')}</b></span>
    <span class="unit-title">${r.name}</span>
    <span class="unit-vi">Ôn tập Unit ${r.units[0]}–${r.units[4]} · SGK tr.${r.page}</span>
    <span class="unit-meta"><span class="muted" style="font-weight:800;font-size:.85rem">${best ? `Điểm cao nhất: ${best}%` : 'Chưa làm'}</span></span>
  </button>`;
}
function renderHome() {
  const p = P(); const d = ensureDaily(); const rec = nextRecommendation();
  const pct = Math.min(100, Math.round(d.xp / p.set.goal * 100));
  const allClaimed = d.quests.every(q => q.claimed);
  const term = t => `
    <section class="section-title"><div class="term-head"><span class="term-tag">Học kì ${t === 1 ? 'I' : 'II'}</span><h2>${t === 1 ? 'Sách Tập một · Me and My Friends · Me and My School' : 'Sách Tập hai · Me and My Family · Me and the World Around'}</h2></div></section>
    <div class="unit-list">${UNITS.filter(u => u.term === t).slice(0, 5).map(unitCard).join('')}${reviewCard(REVIEWS[t === 1 ? 0 : 2])}
    ${UNITS.filter(u => u.term === t).slice(5).map(unitCard).join('')}${reviewCard(REVIEWS[t === 1 ? 1 : 3])}</div>`;
  return `
  <div class="hero-grid">
    <div class="card continue-card">
      <span class="eyebrow">${rec ? 'Học tiếp theo lộ trình' : 'Bé đã hoàn thành mọi chặng!'}</span>
      ${rec ? `<span class="unit-pill">Unit ${rec.u.unit}</span><h2>${esc(rec.u.title)}</h2>
        <p>Chặng ${STEPS.indexOf(rec.s) + 1}/6: <b>${rec.s.name}</b> – ${rec.s.desc}</p>
        <button class="btn big" data-start="${rec.u.unit}:${rec.s.id}">${emo(rec.s.icon)} Học ngay</button>`
      : `<h2>Tuyệt vời, ${esc(p.name)}!</h2><p>Hãy ôn tập để giữ vững kiến thức và săn thêm sao nhé.</p><button class="btn big" data-nav="review">${emo('🔁')} Ôn tập</button>`}
    </div>
    <div class="card goal-card">
      <div class="goal-head"><div class="ring" style="--p:${pct}"><span>${d.xp}/${p.set.goal}</span></div>
        <div><span class="eyebrow">Mục tiêu hôm nay</span><h3>${d.goalDone ? 'Đã đạt! 🎉' : `Còn ${Math.max(0, p.set.goal - d.xp)} XP nữa`}</h3>
        <p class="muted" style="font-size:.88rem">Đạt mục tiêu để mở rương quà.</p></div></div>
      ${d.quests.map((q, i) => { const Q = QUESTS.find(x => x.id === q.id); const full = q.prog >= q.n; return `
        <div class="quest ${full ? 'done' : ''}">${emo(Q.icon)}<div class="quest-text">${Q.text(q.n)}<div class="bar sun"><i style="width:${q.prog / q.n * 100}%"></i></div></div>
        ${q.claimed ? emo('✅') : full ? `<button class="btn green quest-claim" data-claim="${i}">Nhận</button>` : `<small class="muted" style="font-weight:800">${q.prog}/${q.n}</small>`}</div>`; }).join('')}
      ${allClaimed && !d.bonus ? `<button class="btn sun" data-bonus="1">${emo('🎁')} Mở rương thưởng nhiệm vụ</button>` : ''}
      ${p.chestsPending > 0 ? `<button class="btn orange" data-chest="1">${emo('🎁')} Bé có ${p.chestsPending} rương chưa mở</button>` : ''}
    </div>
  </div>
  ${term(1)}
  ${term(2)}`;
}

// ---------------- 8. Trang Unit: 6 chặng rõ ràng ----------------
function stepUnlocked(n, idx) {
  if (P().set.freeMode || idx === 0) return true;
  return !!P().units[n]?.steps?.[STEPS[idx - 1].id];
}
function renderUnit() {
  const u = UNIT(view.unit); const st = unitState(u.unit);
  const firstOpen = STEPS.findIndex(s => !st.steps[s.id]);
  return `
  <button class="btn ghost back-link" data-nav="home">← Trang chủ</button>
  <section class="unit-hero">
    <div class="unit-badge-big"><small>UNIT</small><b>${u.unit}</b></div>
    <div><h1>${esc(u.title)}</h1><p class="vi">${esc(u.vi)}</p>
      <div class="row"><span class="tag">Học kì ${u.term === 1 ? 'I' : 'II'}</span><span class="tag">SGK Tập ${u.term === 1 ? 'một' : 'hai'} · trang ${u.page}</span><span class="tag">${u.words.length} từ · ${u.patterns.length} mẫu câu</span>
      <span class="stars">${[1, 2, 3].map(i => `<span class="${st.stars >= i ? '' : 'off'}">⭐</span>`).join('')}</span></div></div>
  </section>
  <section class="section-title"><h2>Lộ trình bài học</h2><span class="muted" style="font-weight:800">${stepsDone(u.unit)}/6 chặng đã xong</span></section>
  <div class="path">${STEPS.map((s, i) => {
    const done = !!st.steps[s.id]; const open = stepUnlocked(u.unit, i);
    return `<button class="step s-${s.id} ${done ? 'done' : ''} ${i === firstOpen ? 'next' : ''}" data-start="${u.unit}:${s.id}" ${open ? '' : 'disabled'}>
      <span class="step-ico">${emo(open ? s.icon : '🔒')}</span>
      <span><span class="step-no">Chặng ${i + 1}</span><span class="step-name" style="display:block">${s.name}</span><span class="step-desc">${s.desc}</span></span>
      <span class="step-state">${done ? (s.id === 'test' ? `${st.best}% ✓` : '✓ Đã xong') : open ? (i === firstOpen ? 'Bắt đầu →' : 'Mở') : 'Hoàn thành chặng trước'}</span></button>`;
  }).join('')}</div>
  <div class="extra-row">
    <button class="card" data-memory="${u.unit}" style="text-align:left;cursor:pointer"><span class="eyebrow">Trò chơi thêm</span><h3>${emo('🧠')} Lật thẻ trí nhớ</h3><p class="muted">Ghép tranh với từ tiếng Anh.</p></button>
  </div>

}

}

    else if (d.delprofile) { confirmBox('Xoá hồ sơ này?', `Hồ sơ <b>${esc(P().name)}</b> và toàn bộ tiến độ sẽ bị xoá khỏi thiết bị.`, 'Xoá hồ sơ', () => { delete DB.profiles[DB.activeId]; DB.activeId = Object.keys(DB.profiles)[0] || null; saveDB(); if (!P()) showOnboarding(false); else go('home'); }); }

function restoreFrom(text) {
  try {
    const raw = text.trim().replace(/^GS5:/, '');
    const obj = raw.startsWith('{') ? JSON.parse(raw) : JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (!obj || !obj.id || obj.xp === undefined || !obj.stats) throw new Error('bad');
    DB.profiles[obj.id] = obj; DB.activeId = obj.id; saveDB();
    toast(`Đã khôi phục tiến độ của ${obj.name}`); go('home');
  } catch (e) { toast('Mã sao lưu không đúng. Hãy kiểm tra lại.'); }
}

// ---------------- 15. Bài học: khởi tạo ----------------
function distractors(w, n, pool) {
  const base = (pool && pool.length >= n + 1 ? pool : ALL_WORDS).filter(x => x.id !== w.id && x.word.toLowerCase() !== w.word.toLowerCase() && x.icon !== w.icon && x.meaning !== w.meaning);
  return shuffle(base).slice(0, n);
}
function choiceQ(w, mode, show, pool) { return { type: 'choice', mode, show, w, options: shuffle([w, ...distractors(w, 3, pool)]) }; }
function spellQ(w) { return { type: 'spell', w }; }
function orderQ(s) { return { type: 'order', s }; }
function gapQ(w, pool) {
  const re = new RegExp(`\\b${w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
  if (!re.test(w.example) || w.example.length > 80) return null;
  return { type: 'gap', w, before: w.example.split(re)[0], after: w.example.split(re).slice(1).join(w.word), options: shuffle([w, ...distractors(w, 3, pool)]) };
}
const spellable = w => { const n = letters(w.word).length; return n >= 2 && n <= 12; };
function sentencePool(units) {
  const out = [];
  units.forEach(u => {
    u.patterns.forEach(p => { out.push({ en: p.q, vi: p.vi.split(' – ')[0], kind: 'pattern' }); out.push({ en: p.a, vi: p.vi.split(' – ')[1] || '', kind: 'pattern' }); });
    u.words.forEach(w => { if (!w.example.includes(' – ')) out.push({ en: w.example, vi: w.exampleVi, kind: 'example', wid: w.id }); });
  });
  return out.filter(s => { const n = s.en.split(' ').length; return n >= 3 && n <= 9; });
}

function newAct(kind, extra) {
  act = { kind, i: 0, qs: [], correct: 0, answered: 0, combo: 0, best: 0, xp: 0, coins: 0, wrongWords: new Set(), retryUsed: new Set(), locked: false, ...extra };
  document.body.classList.add('in-activity');
}
function startStep(n, sid) {
  const u = UNIT(n); const idx = STEPS.findIndex(s => s.id === sid);
  if (!stepUnlocked(n, idx)) { toast('Hãy hoàn thành chặng trước nhé!'); return; }
  view.screen = 'unit'; view.unit = n;
  const words = u.words;
  if (sid === 'learn') { newAct('learn', { unit: n, step: sid, list: words, flipped: false, remembered: new Set() }); return drawAct(); }
  if (sid === 'talk') { newAct('talk', { unit: n, step: sid, heard: new Set() }); return drawAct(); }
  let qs = [];
  if (sid === 'listen') {
    const pick = shuffle(words).slice(0, Math.min(9, words.length));
    qs = pick.map((w, i) => choiceQ(w, i % 3 === 2 ? 'pic' : 'listen', i % 3 === 1 ? 'word' : (i % 3 === 2 ? 'word' : 'pic'), words));
  } else if (sid === 'spell') {
    qs = shuffle(words.filter(spellable)).slice(0, 6).map(spellQ);
  } else if (sid === 'sentence') {
    const pool = sentencePool([u]);
    const pats = shuffle(pool.filter(s => s.kind === 'pattern')).slice(0, 4);
    const ex = shuffle(pool.filter(s => s.kind === 'example')).slice(0, 1);
    const gaps = shuffle(words).map(w => gapQ(w, words)).filter(Boolean).slice(0, 2);
    qs = [...shuffle([...pats, ...ex]).map(orderQ), ...gaps];
  } else if (sid === 'test') {
    qs = buildMixed([u], 10);
  }
  newAct('quiz', { unit: n, step: sid, qs, isTest: sid === 'test' });
  drawAct();
}
function buildMixed(units, total) {
  const words = units.flatMap(u => u.words); const qs = [];
  const ws = shuffle(words);
  const types = ['listen-pic', 'word-meaning', 'pic-word', 'spell', 'gap', 'order', 'listen-word', 'word-meaning', 'gap', 'listen-pic', 'spell', 'order'];
  const sents = shuffle(sentencePool(units));
  let wi = 0;
  for (let k = 0; qs.length < total && k < total * 3; k++) {
    const t = types[k % types.length]; const w = ws[wi++ % ws.length];
    if (t === 'listen-pic') qs.push(choiceQ(w, 'listen', 'pic', words));
    else if (t === 'listen-word') qs.push(choiceQ(w, 'listen', 'word', words));
    else if (t === 'word-meaning') qs.push(choiceQ(w, 'word', 'meaning', words));
    else if (t === 'pic-word') qs.push(choiceQ(w, 'pic', 'word', words));
    else if (t === 'spell' && spellable(w)) qs.push(spellQ(w));
    else if (t === 'gap') { const g = gapQ(w, words); if (g) qs.push(g); }
    else if (t === 'order' && sents.length) qs.push(orderQ(sents.pop()));
  }
  return shuffle(qs).slice(0, total);
}
function startReview(rid) { const r = REVIEWS.find(x => x.id === rid); newAct('quiz', { review: rid, title: r.name, qs: buildMixed(r.units.map(UNIT), 12), isTest: true }); view.screen = 'review'; drawAct(); }
function startMix(t) { newAct('quiz', { title: `Ngẫu nhiên Học kì ${t === 1 ? 'I' : 'II'}`, qs: buildMixed(UNITS.filter(u => u.term === t), 12) }); view.screen = 'review'; drawAct(); }
function startSmart() {
  const weak = weakWords().slice(0, 10); if (!weak.length) return;
  const qs = weak.map((w, i) => i % 3 === 0 ? choiceQ(w, 'listen', 'pic') : i % 3 === 1 ? choiceQ(w, 'word', 'meaning') : (spellable(w) ? spellQ(w) : choiceQ(w, 'pic', 'word')));
  newAct('quiz', { title: 'Ôn từ hay nhầm', qs }); view.screen = 'review'; drawAct();
}

function drawTalk() {
  const u = UNIT(act.unit); const all = u.patterns.length; const heard = act.heard.size;
  return wrapAct(`${head(heard / all * 100)}
    <p class="prompt">Nghe từng đoạn hội thoại rồi nói to theo bạn A và bạn B.</p>
    ${u.patterns.map((p, i) => `<div class="card dialogue">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Mẫu câu ${i + 1}</span>${act.heard.has(i) ? '<span class="tag" style="background:var(--grass-tint);color:#11622F">✓ Đã nghe</span>' : ''}</div>

      <div class="bubble-row b"><span class="who-dot">B</span><div class="bubble">${esc(p.a)}</div></div>
      <p class="dlg-vi">${esc(p.vi)}</p>
      <div class="sound-row"><button class="btn" data-a="dlg" data-i="${i}">${emo('🔊')} Nghe</button><button class="btn ghost" data-a="dlgslow" data-i="${i}">${emo('🐢')} Nghe chậm</button></div></div>`).join('')}
    ${u.rhythm.length ? `<div class="card rhythm"><span class="eyebrow">${u.rhythmLabel}</span><ul>${u.rhythm.map(r => `<li><button class="icon-btn" data-a="sayt" data-t="${esc(r)}" aria-label="Nghe">${emo('🔊')}</button>${esc(r)}</li>`).join('')}</ul></div>` : ''}
    <button class="btn green big block" data-a="talkdone" ${heard >= all ? '' : 'disabled'}>${heard >= all ? 'Hoàn thành chặng' : `Nghe đủ ${all} mẫu câu để hoàn thành (${heard}/${all})`}</button>`);
}
// Câu hỏi luyện tập / kiểm tra
function drawQuestion() {
  const q = act.qs[act.i]; const n = act.qs.length;
  if (!q) return '';
  let body = '';
  if (q.type === 'choice') {
    let prompt = '';
    if (q.mode === 'listen') prompt = `<p class="prompt">Nghe và chọn ${q.show === 'pic' ? 'tranh' : 'từ'} đúng</p><div class="card prompt-card"><button class="speak-big" data-a="say" aria-label="Nghe lại">${emo('🔊')}</button><button class="btn ghost" data-a="slow">${emo('🐢')} Nghe chậm</button></div>`;
    else if (q.mode === 'pic') prompt = `<p class="prompt">Tranh này là gì trong tiếng Anh?</p><div class="card prompt-card">${emo(q.w.icon, 'prompt-icon')}<span class="prompt-sub">${esc(q.w.meaning)}</span></div>`;
    else prompt = `<p class="prompt">Chọn nghĩa đúng của từ</p><div class="card prompt-card"><span class="prompt-word">${esc(q.w.word)}</span>${q.w.phonetic ? `<span class="ipa muted">${esc(q.w.phonetic)}</span>` : ''}<button class="btn ghost" data-a="say">${emo('🔊')} Nghe</button></div>`;
    body = prompt + `<div class="options">${q.options.map((o, k) => `<button class="opt" data-a="pick" data-id="${o.id}" aria-label="Phương án ${k + 1}">
      ${q.show === 'pic' ? `${emo(o.icon)}<small>${esc(o.meaning)}</small>` : q.show === 'word' ? `<b>${esc(o.word)}</b>` : `<b>${esc(o.meaning)}</b>`}</button>`).join('')}</div>`;
  } else if (q.type === 'gap') {
    body = `<p class="prompt">Chọn từ đúng để điền vào chỗ trống</p><div class="card prompt-card"><p class="gap-sentence">${esc(q.before)}<span class="blank">${act.locked ? esc(q.w.word) : ''}</span>${esc(q.after)}</p><span class="muted" style="font-weight:700">${esc(q.w.exampleVi)}</span></div>
      <div class="options">${q.options.map(o => `<button class="opt" data-a="pick" data-id="${o.id}"><b>${esc(o.word)}</b></button>`).join('')}</div>`;
  } else if (q.type === 'spell') {
    if (!q.bank) { const L = letters(q.w.word); q.layout = q.w.word.split('').map(ch => /[a-z]/i.test(ch) ? 'slot' : ch); q.slots = Array(L.length).fill(null); q.bank = shuffle(L.split('').map((ch, k) => ({ k, ch, used: false }))); }
    let si = 0;
    const slots = q.layout.map(part => { if (part !== 'slot') return part === ' ' ? '<span class="gap"></span>' : `<span class="fixed-ch">${esc(part)}</span>`; const k = si++; const s = q.slots[k]; return `<span class="slot ${s ? 'filled' : ''} ${q.mark ? (q.mark[k] ? 'good' : 'bad') : ''}" data-a="unslot" data-k="${k}">${s ? s.ch : ''}</span>`; }).join('');
    body = `<p class="prompt">Ghép chữ cái thành từ tiếng Anh</p><div class="card prompt-card">${emo(q.w.icon, 'prompt-icon')}<span class="prompt-sub">${esc(q.w.meaning)}</span><button class="btn ghost" data-a="say">${emo('🔊')} Nghe từ</button></div>
      <div class="slots ${q.slots.length > 9 ? 'compact' : ''}">${slots}</div>
      <div class="tiles">${q.bank.map((t, k) => `<button class="tile ${t.used ? 'used' : ''}" data-a="tile" data-k="${k}" ${t.used ? 'disabled' : ''}>${t.ch}</button>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn ghost" data-a="hint" ${act.locked ? 'disabled' : ''}>${emo('💡')} Gợi ý 1 chữ</button><button class="btn ghost" data-a="clear" ${act.locked ? 'disabled' : ''}>Xoá làm lại</button></div>`;
  } else if (q.type === 'order') {
    if (!q.bank) { const toks = q.s.en.split(' '); let b = shuffle(toks.map((t, k) => ({ k, t, used: false }))); if (b.every((x, k) => x.k === k)) b.push(b.shift()); q.bank = b; q.ans = []; }
    body = `<p class="prompt">Nghe rồi sắp xếp các từ thành câu đúng</p><div class="card prompt-card"><span class="prompt-sub">${esc(q.s.vi)}</span><div class="sound-row"><button class="btn" data-a="sayt" data-t="${esc(q.s.en)}">${emo('🔊')} Nghe câu</button><button class="btn ghost" data-a="slowt" data-t="${esc(q.s.en)}">${emo('🐢')} Chậm</button></div></div>
      <div class="answer-line ${q.mark || ''}">${q.ans.map((t, k) => `<button class="tile word" data-a="unans" data-k="${k}">${esc(t.t)}</button>`).join('') || '<span class="muted" style="font-weight:700">Chạm vào các thẻ từ bên dưới</span>'}</div>
      <div class="tiles">${q.bank.map((t, k) => `<button class="tile word ${t.used ? 'used' : ''}" data-a="tok" data-k="${k}" ${t.used ? 'disabled' : ''}>${esc(t.t)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn ghost" data-a="oclear" ${act.locked ? 'disabled' : ''}>Xoá làm lại</button><button class="btn green" data-a="ocheck" ${q.ans.length === q.bank.length && !act.locked ? '' : 'disabled'}>Kiểm tra</button></div>`;
  }
  return wrapAct(`${head(act.i / n * 100)}${body}<div id="fb"></div>`);
}
function praise() { return ['Chính xác!', 'Giỏi quá!', 'Tuyệt vời!', 'Đúng rồi!', 'Xuất sắc!', 'Siêu đỉnh!'][rand(0, 5)]; }
function answer(ok, q, correctText) {
  act.locked = true; act.answered++;
  const p = P(); p.stats.answered++;
  const wid = q.w?.id || q.s?.wid;
  let gained = 0;
  if (ok) {
    act.correct++; act.combo++; act.best = Math.max(act.best, act.combo);
    gained = 10 + Math.min(act.combo - 1, 5) * 2; act.xp += gained; act.coins += 1;
    p.stats.correct++; p.stats.maxCombo = Math.max(p.stats.maxCombo, act.combo);
    if (q.mode === 'listen') { p.stats.listenCorrect++; questProgress('listen'); }
    if (q.type === 'order') { p.stats.orderCorrect++; questProgress('order'); }
    questProgress('correct'); questProgress('combo', act.combo, 'max');
    if (wid) { const s = wordState(wid); s.m = Math.min(5, s.m + 1); s.seen++; }
    gainXP(gained); gainCoins(1); Sound.correct();
  } else {
    act.combo = 0; Sound.wrong();
    if (wid) { const s = wordState(wid); s.m = Math.max(0, s.m - 1); s.wrong++; s.seen++; act.wrongWords.add(wid); }
    // Câu sai được hỏi lại ở cuối bài (chỉ ở bài luyện tập, không ở bài kiểm tra)
    if (!act.isTest && !act.retryUsed.has(act.i)) { act.retryUsed.add(act.qs.length); const copy = { ...q, bank: null, ans: null, slots: null, mark: null, options: q.options ? shuffle(q.options) : undefined }; act.qs.push(copy); }
  }
  saveDB(); renderTop();
  const say = q.type === 'order' ? q.s.en : q.w?.word;
  $('#fb').outerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}" id="fb" role="status"><div class="msg"><b>${ok ? praise() : 'Chưa đúng rồi!'}</b>${ok ? `<span class="xp">+${gained} XP · +1 ⭐${act.combo >= 3 ? ` · Chuỗi đúng x${act.combo}` : ''}</span>` : `Đáp án đúng: <b style="display:inline;font-family:var(--font-body);font-size:1rem">${esc(correctText)}</b>${act.isTest ? '' : ' · Câu này sẽ được hỏi lại.'}`}</div>
    <button class="btn ${ok ? 'green' : 'red'} big" data-a="next" id="btn-next">Tiếp tục →</button></div>`;
  $('.combo').textContent = act.combo >= 2 ? `🔥 x${act.combo}` : '';
  if (say) setTimeout(() => Sound.speak(say), ok ? 250 : 500);
  setTimeout(() => $('#btn-next')?.focus(), 50);
}
function onActClick(e) {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a; const q = act.qs?.[act.i];
  if (a === 'quit') { confirmBox('Thoát bài học?', 'Kết quả của lượt này sẽ không được lưu.', 'Thoát', () => go(act?.unit && act.step ? 'unit' : (view.screen === 'review' ? 'review' : 'home'))); return; }
  // Học từ mới
  if (act.kind === 'learn') {
    const w = act.list[act.i];
    if (a === 'flip') { act.flipped = !act.flipped; Sound.flip(); $('.flash').classList.toggle('flipped', act.flipped); if (act.flipped) setTimeout(() => Sound.speak(w.example), 350); }
    else if (a === 'say') Sound.speak(w.word); else if (a === 'slow') Sound.speak(w.word, true); else if (a === 'sayex') Sound.speak(w.example);
    else if (a === 'know' || a === 'again') {
      const s = wordState(w.id); s.seen++;
      if (a === 'know') { if (!act.remembered.has(w.id)) { act.remembered.add(w.id); s.m = Math.max(s.m, 2) + 1; s.m = Math.min(5, s.m); gainXP(5); act.xp += 5; questProgress('learn'); } Sound.correct(); }
      else { s.m = Math.max(0, s.m - 1); act.list.push(w); Sound.pop(); }
      act.flipped = false; act.i++; saveDB();
      if (act.i >= act.list.length) finishStep(); else drawAct();
    }
    return;
  }
  if (act.kind === 'talk') {
    const u = UNIT(act.unit);
    if (a === 'dlg' || a === 'dlgslow') { const i = +b.dataset.i; const p = u.patterns[i]; Sound.speakSeq([p.q, p.a], a === 'dlgslow'); if (!act.heard.has(i)) { act.heard.add(i); P().stats.talk++; questProgress('talk'); gainXP(5); act.xp += 5; saveDB(); setTimeout(drawAct, 150); } }
    else if (a === 'sayt') Sound.speak(b.dataset.t);
    else if (a === 'talkdone') finishStep();
    return;
  }
  if (act.kind === 'memory') return memoryClick(b);
  // Câu hỏi
  if (a === 'say') Sound.speak(q.w.word); else if (a === 'slow') Sound.speak(q.w.word, true);
  else if (a === 'sayt') Sound.speak(b.dataset.t); else if (a === 'slowt') Sound.speak(b.dataset.t, true);
  else if (a === 'next') { act.i++; act.locked = false; if (act.i >= act.qs.length) finishStep(); else drawAct(); }
  else if (act.locked) return;
  else if (a === 'pick') {
    const ok = b.dataset.id === q.w.id;
    $$('.opt').forEach(o => { o.disabled = true; if (o.dataset.id === q.w.id) o.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    if (q.type === 'gap') $('.blank').textContent = q.w.word;
    answer(ok, q, q.show === 'meaning' ? `${q.w.word} = ${q.w.meaning}` : q.w.word);
  } else if (a === 'tile') {
    const t = q.bank[+b.dataset.k]; const k = q.slots.indexOf(null); if (t.used || k < 0) return;
    t.used = true; q.slots[k] = t; Sound.pop();
    if (!q.slots.includes(null)) { const L = letters(q.w.word); q.mark = q.slots.map((s, i) => s.ch === L[i]); drawAct(); answer(q.mark.every(Boolean), q, q.w.word); } else drawAct();
  } else if (a === 'unslot') { const k = +b.dataset.k; const s = q.slots[k]; if (!s) return; s.used = false; q.slots[k] = null; Sound.pop(); drawAct(); }
  else if (a === 'clear') { q.slots.fill(null); q.bank.forEach(t => t.used = false); drawAct(); }
  else if (a === 'hint') { const L = letters(q.w.word); const k = q.slots.findIndex((s, i) => !s || s.ch !== L[i]); if (k < 0) return; if (q.slots[k]) { q.slots[k].used = false; q.slots[k] = null; } const t = q.bank.find(x => !x.used && x.ch === L[k]) || q.slots.find((s, i) => s && i > k && s.ch === L[k]); if (t) { const old = q.slots.indexOf(t); if (old >= 0) q.slots[old] = null; t.used = true; q.slots[k] = t; } act.hinted = true; Sound.pop(); if (!q.slots.includes(null)) { q.mark = q.slots.map((s, i) => s.ch === L[i]); drawAct(); answer(q.mark.every(Boolean), q, q.w.word); } else drawAct(); }
  else if (a === 'tok') { const t = q.bank[+b.dataset.k]; if (t.used) return; t.used = true; q.ans.push(t); Sound.pop(); drawAct(); }
  else if (a === 'unans') { const [t] = q.ans.splice(+b.dataset.k, 1); t.used = false; Sound.pop(); drawAct(); }
  else if (a === 'oclear') { q.ans = []; q.bank.forEach(t => t.used = false); drawAct(); }
  else if (a === 'ocheck') { const ok = q.ans.map(t => t.t).join(' ') === q.s.en; q.mark = ok ? 'good' : 'bad'; drawAct(); answer(ok, q, q.s.en); }
}

// Lật thẻ trí nhớ
function startMemory(n) {
  const u = UNIT(n); const seen = new Set();
  const pick = shuffle(u.words).filter(w => !seen.has(w.icon) && seen.add(w.icon)).slice(0, 6);
  const cards = shuffle(pick.flatMap(w => [{ w, t: 'pic' }, { w, t: 'word' }]));
  newAct('memory', { unit: n, title: `Lật thẻ – Unit ${n}`, cards, open: [], matched: 0, pairs: pick.length, moves: 0 });
  view.screen = 'unit'; view.unit = n; drawAct();
}
function drawMemory() {
  return wrapAct(`<div class="act-head"><button class="close" data-a="quit" aria-label="Thoát">✕</button><div class="bar"><i style="width:${act.matched / act.pairs * 100}%"></i></div><span class="combo">${act.moves} lượt</span></div>
    <div class="act-label s-talk"><span class="pill" style="background:var(--c)">Unit ${act.unit} · Trò chơi</span><b>Lật thẻ trí nhớ</b></div>
    <p class="prompt">Tìm các cặp tranh và từ tiếng Anh giống nhau</p>
    <div class="mem-grid">${act.cards.map((c, i) => `<button class="mem ${c.open ? 'open' : ''} ${c.ok ? 'ok' : ''}" data-a="mem" data-i="${i}" aria-label="Thẻ ${i + 1}"><span class="mem-in"><span class="mem-f">?</span><span class="mem-b">${c.t === 'pic' ? `${emo(c.w.icon)}<small>${esc(c.w.meaning)}</small>` : esc(c.w.word)}</span></span></button>`).join('')}</div>`);
}
function memoryClick(b) {
  if (b.dataset.a !== 'mem' || act.locked) return;
  const c = act.cards[+b.dataset.i]; if (c.open || c.ok) return;
  c.open = true; act.open.push(c); Sound.flip(); if (c.t === 'word') Sound.speak(c.w.word);
  if (act.open.length === 2) {
    act.moves++; const [x, y] = act.open; act.locked = true;
    if (x.w.id === y.w.id) { setTimeout(() => { x.ok = y.ok = true; act.matched++; act.open = []; act.locked = false; Sound.correct(); gainXP(5); act.xp += 5; saveDB(); renderTop(); if (act.matched === act.pairs) finishStep(); else drawAct(); }, 350); }
    else setTimeout(() => { x.open = y.open = false; act.open = []; act.locked = false; Sound.wrong(); drawAct(); }, 1000);
  }
  drawAct();
}

// ---------------- 17. Kết thúc chặng: tổng kết & thưởng ----------------
function finishStep() {
  const p = P(); const a = act;
  const acc = a.answered ? Math.round(a.correct / a.answered * 100) : 100;
  let stars = 0, passed = true;
  if (a.isTest) { stars = acc >= 90 ? 3 : acc >= 70 ? 2 : acc >= 50 ? 1 : 0; passed = stars > 0; }
  const bonus = a.kind === 'memory' ? 10 : 20 + (a.answered && acc === 100 ? 10 : 0);
  gainXP(bonus); a.xp += bonus; gainCoins(5); a.coins += 5;
  if (a.unit && a.step && passed) { const st = unitState(a.unit); st.steps[a.step] = true; if (a.isTest) { st.stars = Math.max(st.stars, stars); st.best = Math.max(st.best, acc); if (acc === 100) p.stats.perfectTests++; } }
  if (a.review) { const st = (p.units[a.review] ||= { steps: {}, stars: 0, best: 0 }); st.best = Math.max(st.best, acc); }
  if (passed) { p.stats.steps++; questProgress('steps'); markStudyToday(); }
  checkBadges(); saveDB();
  Sound.win(); Confetti.burst(passed ? 120 : 40);
  const nextIdx = a.unit && a.step ? STEPS.findIndex(s => s.id === a.step) + 1 : -1;
  const next = nextIdx > 0 && nextIdx < STEPS.length ? STEPS[nextIdx] : null;
  const wrongs = [...a.wrongWords].map(WORD).filter(Boolean);
  $('#content').innerHTML = `<div class="act"><div class="card summary">
    ${a.isTest ? `<div class="big-stars">${[1, 2, 3].map(i => `<span class="${stars >= i ? '' : 'off'}">⭐</span>`).join('')}</div>` : `<div style="font-size:4rem">${emo(passed ? '🎉' : '💪')}</div>`}
    <h2>${a.isTest ? (stars === 3 ? 'Hoàn hảo!' : stars === 2 ? 'Rất tốt!' : stars === 1 ? 'Đã qua bài!' : 'Cố lên, thử lại nhé!') : 'Hoàn thành chặng!'}</h2>
    <p class="muted">${a.unit ? `Unit ${a.unit}: ${esc(UNIT(a.unit).title)}` : esc(a.title || '')}${a.step ? ` · ${STEP(a.step).name}` : ''}</p>
    <div class="sum-stats"><div class="sum-stat"><b>+${a.xp}</b><span>XP</span></div><div class="sum-stat"><b>${a.answered ? acc + '%' : '✓'}</b><span>${a.answered ? 'Độ chính xác' : 'Hoàn thành'}</span></div><div class="sum-stat"><b>+${a.coins}</b><span>⭐ sao</span></div></div>
    ${a.best >= 3 ? `<p style="font-weight:900;color:var(--orange-deep)">🔥 Chuỗi đúng dài nhất: ${a.best} câu</p>` : ''}
    ${wrongs.length ? `<div><span class="eyebrow">Từ cần ôn thêm</span><div class="row" style="justify-content:center;margin-top:6px">${wrongs.map(w => `<span class="tag">${w.icon} ${esc(w.word)} = ${esc(w.meaning)}</span>`).join('')}</div></div>` : ''}
    ${passed ? `<p class="eyebrow">Phần thưởng hoàn thành chặng</p><button class="chest" id="sum-chest" aria-label="Mở rương">${emo('🎁')}</button><div class="reward-pop" id="sum-reward">Chạm vào rương để mở!</div>` : ''}
    <div class="row" style="justify-content:center">
      ${a.unit && a.step ? `<button class="btn ghost" id="sum-back">Về trang Unit</button>` : `<button class="btn ghost" id="sum-back">Quay lại</button>`}
      ${!passed && a.unit ? `<button class="btn orange" id="sum-retry">Làm lại</button>` : ''}
      ${next && passed ? `<button class="btn green big" id="sum-next">${emo(next.icon)} Chặng tiếp: ${next.name}</button>` : ''}
    </div></div></div>`;
  const backTo = a.unit ? 'unit' : (a.review || a.title ? 'review' : 'home');
  const unitN = a.unit;
  const leave = fn => { act = null; document.body.classList.remove('in-activity'); fn(); };
  $('#sum-back').onclick = () => leave(() => go(backTo, { unit: unitN }));
  $('#sum-next') && ($('#sum-next').onclick = () => leave(() => startStep(unitN, next.id)));
  $('#sum-retry') && ($('#sum-retry').onclick = () => leave(() => startStep(unitN, a.step)));
  const ch = $('#sum-chest');
  if (ch) ch.onclick = () => { if (ch.disabled) return; ch.disabled = true; const r = rollChest(); ch.classList.add('opened'); Sound.coin(); Confetti.burst(60); ch.innerHTML = emo(r.kind === 'sticker' ? r.s.icon : '⭐'); $('#sum-reward').innerHTML = r.kind === 'sticker' ? `Nhãn dán mới: <b>${esc(r.s.name)}</b> (${RAR_NAME[r.s.rar]})` : `+${r.coins} ⭐`; checkBadges(); saveDB(); renderTop(); flushCelebrations(); };
  renderTop(); flushCelebrations();
}

// ---------------- 18. Khởi động ----------------
function boot() {
  loadDB(); Sound.init();
  document.addEventListener('click', e => { const n = e.target.closest('[data-nav]'); if (n && !n.closest('#content')) { Sound.pop(); go(n.dataset.nav); } });
  $('#btn-sound').onclick = () => { const p = P(); if (!p) return; p.set.sound = !p.set.sound; saveDB(); renderTop(); };
  $('#btn-help').onclick = () => { Sound.pop(); go('help'); };
  $('#top-who').onclick = () => { Sound.pop(); go('settings'); };
  document.addEventListener('keydown', e => {
    if (!act || $('.overlay')) return;
    if (e.key === 'Enter' && $('#btn-next')) { e.preventDefault(); $('#btn-next').click(); }
    if (act.kind === 'quiz' && !act.locked && /^[1-4]$/.test(e.key)) { const o = $$('.opt')[+e.key - 1]; o && o.click(); }
    if (act.kind === 'learn' && e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); $('.flash')?.click(); }
  });
  if (!P()) { const first = Object.keys(DB.profiles)[0]; if (first) DB.activeId = first; }
  if (!P()) showOnboarding(false); else render();
}
document.addEventListener('DOMContentLoaded', boot);
